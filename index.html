                    desc: '서울에서 가장 접근하기 좋은 캠핑과 강변 피크닉의 메카.',
                    distance: '경춘선 가평역 약 1시간',
                    transport: 'ITX-청춘 또는 경춘선 지하철 (가평역 하차)',
                    cost: '1박 2일 기준 총 약 7만 ~ 15만 원 (1인 기준)',
                    image: 'https://placehold.co/600x400/0d9488/ffffff?text=Theme+Camping',
                    tips: '자라섬 남도 꽃정원 시즌별 축제 방문',
                    budgetBreakdown: '경춘선 지하철/ITX: 약 6천 원 | 캠핑장/펜션(1박): 약 4~10만 원 | 도보/택시: 약 1만 원 | 식비: 약 4~6만 원',
                    itinerary: [
                        {
                            day: '1일차: 자라섬 남도 피크닉',
                            timeline: [
                                { time: '10:00 - 11:00', desc: '청량리역 또는 상봉역 출발 ➔ 가평역 도착 (경춘선 1시간 소요)' },
                                { time: '11:00 - 12:30', desc: '가평 잣국수 또는 닭갈비로 점심 식사' },
                                { time: '12:30 - 16:30', desc: '자라섬 서도 및 남도 꽃정원 자전거 대여 후 산책' },
                                { time: '16:30 - 18:00', desc: '가평 레저카트 체험 또는 북한강변 산책' },
                                { time: '18:00 ~', desc: '자라섬 오토캠핑장 또는 북한강 리버뷰 숙소 체크인 후 바비큐 저녁' }
                            ]
                        },
                        {
                            day: '2일차: 남이섬 인근 및 귀경',
                            timeline: [
                                { time: '09:30 - 11:30', desc: '남이섬 선착장 주변 강변 산책 및 감성 카페 방문' },
                                { time: '11:30 - 13:00', desc: '민물 매운탕 또는 막국수 점심 식사' },
                                { time: '13:00 - 14:00', desc: '가평역 이동' },
                                { time: '14:20 - 15:20', desc: '가평역 출발 ➔ 서울로 귀경' }
                            ]
                        }
                    ]
                }
            ]
        };

        let currentCategory = 'steady';

        // Initialize display on load
        window.onload = function() {
            renderDestinations(currentCategory);
        };

        // Switch Tab Handler
        function switchTab(category) {
            currentCategory = category;
            
            // Update Tab button styles
            const tabs = ['steady', 'hot', 'quiet', 'theme'];
            tabs.forEach(t => {
                const btn = document.getElementById(`btn-${t}`);
                if (t === category) {
                    btn.className = "px-4 py-2 rounded-xl text-sm font-semibold transition-all shadow-md bg-white text-blue-600 tab-active";
                } else {
                    btn.className = "px-4 py-2 rounded-xl text-sm font-semibold transition-all shadow-md bg-white/10 text-white hover:bg-white/20";
                }
            });

            document.getElementById('searchInput').value = '';
            renderDestinations(category);
        }

        // Render Destinations Grid
        function renderDestinations(category, searchQuery = '') {
            const grid = document.getElementById('destinationsGrid');
            let data = travelData[category] || [];

            if (searchQuery.trim() !== '') {
                const q = searchQuery.toLowerCase();
                data = data.filter(item => 
                    item.name.toLowerCase().includes(q) || 
                    item.desc.toLowerCase().includes(q) ||
                    item.theme.toLowerCase().includes(q)
                );
            }

            document.getElementById('resultCount').innerText = `총 ${data.length}개 여행지 표시 중`;

            if (data.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-16 text-center text-slate-400">
                        <p class="text-3xl mb-2">🥲</p>
                        <p class="text-base font-medium">검색 결과가 없습니다. 다른 검색어를 입력해보세요.</p>
                    </div>
                `;
                return;
            }

            let html = '';
            data.forEach(item => {
                html += `
                    <div onclick="openModal('${item.id}')" class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-xl transition-all cursor-pointer flex flex-col group">
                        <div class="relative h-48 overflow-hidden bg-slate-100">
                            <img src="${item.image}" alt="${item.name}" onerror="this.src='https://placehold.co/600x400/e2e8f0/64748b?text=Image+Ready'" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                            <span class="absolute top-3 left-3 bg-blue-600 text-white text-xs font-semibold px-2.5 py-1 rounded-full shadow">${item.theme}</span>
                        </div>
                        <div class="p-5 flex flex-col flex-grow">
                            <h3 class="text-lg font-bold text-slate-900 mb-2">${item.name}</h3>
                            <p class="text-slate-600 text-sm mb-4 line-clamp-2">${item.desc}</p>
                            <div class="mt-auto pt-4 border-t border-slate-100 space-y-1.5 text-xs text-slate-500 font-medium">
                                <div class="flex items-center gap-1.5"><span>⏱️</span> 소요시간: ${item.distance}</div>
                                <div class="flex items-center gap-1.5 truncate"><span>🚆</span> 교통편: ${item.transport}</div>
                                <div class="flex items-center gap-1.5 text-blue-600 font-semibold"><span>💰</span> 총 예상비용: ${item.cost}</div>
                            </div>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        // Filter input handler
        function filterDestinations() {
            const query = document.getElementById('searchInput').value;
            renderDestinations(currentCategory, query);
        }

        // Modal Open Handler
        function openModal(id) {
            let found = null;
            for (let key in travelData) {
                const match = travelData[key].find(item => item.id === id);
                if (match) {
                    found = match;
                    break;
                }
            }

            if (!found) return;

            // Generate detailed itinerary timeline HTML
            let itineraryHtml = '';
            if (found.itinerary && found.itinerary.length > 0) {
                found.itinerary.forEach(dayPlan => {
                    itineraryHtml += `
                        <div class="mb-4">
                            <h5 class="font-bold text-slate-800 text-sm mb-2 pb-1 border-b border-blue-200">📌 ${dayPlan.day}</h5>
                            <div class="space-y-2">
                    `;
                    dayPlan.timeline.forEach(t => {
                        itineraryHtml += `
                            <div class="flex items-start text-xs sm:text-sm gap-3">
                                <span class="font-semibold text-blue-600 min-w-[95px] bg-blue-50 px-2 py-0.5 rounded text-center">${t.time}</span>
                                <span class="text-slate-700">${t.desc}</span>
                            </div>
                        `;
                    });
                    itineraryHtml += `
                            </div>
                        </div>
                    `;
                });
            }

            const modalContent = document.getElementById('modalContent');
            modalContent.innerHTML = `
                <div class="relative h-48 rounded-xl overflow-hidden mb-4 bg-slate-100">
                    <img src="${found.image}" alt="${found.name}" class="w-full h-full object-cover">
                    <span class="absolute top-3 left-3 bg-blue-600 text-white text-xs font-semibold px-2.5 py-1 rounded-full">${found.theme}</span>
                </div>
                <h3 class="text-2xl font-bold text-slate-900 mb-2">${found.name}</h3>
                <p class="text-slate-600 text-sm mb-4 leading-relaxed">${found.desc}</p>
                
                <div class="bg-slate-50 rounded-xl p-4 space-y-2.5 text-xs sm:text-sm mb-6 border border-slate-200">
                    <div class="flex items-start gap-2">
                        <span class="font-bold text-slate-700 min-w-[80px]">📍 거리/소요:</span>
                        <span class="text-slate-700">${found.distance}</span>
                    </div>
                    <div class="flex items-start gap-2">
                        <span class="font-bold text-slate-700 min-w-[80px]">🚗 교통편:</span>
                        <span class="text-slate-700">${found.transport}</span>
                    </div>
                    <div class="flex items-start gap-2">
                        <span class="font-bold text-slate-700 min-w-[80px]">💳 총 예상비용:</span>
                        <span class="text-blue-600 font-bold">${found.cost}</span>
                    </div>
                    <div class="flex items-start gap-2 pt-2 border-t border-slate-200">
                        <span class="font-bold text-slate-700 min-w-[80px]">📊 예산 내역:</span>
                        <span class="text-slate-700 text-xs">${found.budgetBreakdown}</span>
                    </div>
                    <div class="flex items-start gap-2 pt-2 border-t border-slate-200">
                        <span class="font-bold text-slate-700 min-w-[80px]">💡 여행 팁:</span>
                        <span class="text-emerald-700 font-medium">${found.tips}</span>
                    </div>
                </div>

                <!-- Detailed Hourly Itinerary Section -->
                <div class="bg-white rounded-xl p-4 border border-slate-200 mb-6 shadow-sm">
                    <h4 class="font-bold text-slate-900 text-base mb-4 flex items-center gap-2">
                        <span>🕒 구체적인 1박 2일 타임라인 일정</span>
                    </h4>
                    ${itineraryHtml}
                </div>

                <button onclick="closeModal()" class="w-full bg-slate-900 text-white font-semibold py-2.5 rounded-xl text-sm hover:bg-slate-800 transition-colors">확인</button>
            `;

            document.getElementById('detailModal').classList.remove('hidden');
        }

        // Modal Close Handler
        function closeModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        // Close modal on background click
        window.onclick = function(event) {
            const modal = document.getElementById('detailModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
