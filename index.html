                return { bgClass, iconPath };

                                </span>
                            </div>
                        </div>
                        
                        <!-- 하단 상세 설명 -->
                        <div class="p-5 flex flex-col flex-grow relative bg-white">

                            </div>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

                if (match) {

                    break;
                }
            }

            if (!found) return;

            let itineraryHtml = '';
            if (found.itinerary && found.itinerary.length > 0) {
                found.itinerary.forEach(dayPlan => {
                    itineraryHtml += `
                        <div class="mb-5 bg-white p-4 rounded-xl border border-slate-100 shadow-sm">

                        itineraryHtml += `

                                <span class="font-bold text-blue-600 min-w-[100px] sm:min-w-[120px] bg-blue-50/50 px-2.5 py-1 rounded-md text-center shadow-sm border border-blue-100">${t.time}</span>

            const closeBtn = document.querySelector('.bg-slate-100.rounded-full.z-20');

            if (mapContainer.classList.contains('fixed')) {
                // 원래 크기로 축소 (모달 내장)
                mapContainer.className = 'relative h-64 sm:h-72 rounded-xl overflow-hidden mb-5 bg-slate-100 shadow-inner transition-all duration-300 z-10 group';
                expandText.innerText = '지도 크게 보기';
                expandIcon.innerText = '⛶';
                closeBtn.style.display = 'flex'; // 모달 닫기 버튼 다시 표시
            } else {
                // 전체화면 모드로 확장 (화면 꽉 차게)
                mapContainer.className = 'fixed inset-0 z-[100] h-[100dvh] w-[100vw] bg-slate-100 transition-all duration-300 m-0 p-0 rounded-none';
                expandText.innerText = '지도 축소하기';
                expandIcon.innerText = '✖';
                closeBtn.style.display = 'none'; // 전체화면 중엔 모달 닫기 버튼 숨김
            }
        }

        // 배경 클릭 시 모달 닫기
        window.onclick = function(event) {
            const modal = document.getElementById('detailModal');
            // 전체화면 맵 상태가 아닐 때만 배경 클릭으로 닫힘
            if (event.target === modal && !document.getElementById('mapContainer').classList.contains('fixed')) {
                closeModal();
            }
        }
    </script>
</body>
</html>
